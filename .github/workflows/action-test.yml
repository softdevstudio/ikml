name: action-test

# Runs the GitHub Action in this repo (action.yml) with an ikml built from
# this commit on Linux, macOS and Windows: the good fixtures (ok), the bad
# fixtures (reported with fail off, failing with it on), one file, warnings
# with strict, a missing path and a bad switch. The install job runs the
# download path of a published release on every push. The download job runs
# the action on the published binaries, pinned to the newest tag and
# unpinned; it starts by itself after each release and can be started by hand.
on:
  push:
    branches: [main]
    paths: [action.yml, .github/workflows/action-test.yml, "cmd/**", "*.go", go.mod, "testdata/**"]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the download job pins (vX.Y.Z); empty means the newest release
        required: false
        default: ""

permissions:
  contents: read

jobs:
  local:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build ikml
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ikml$ext" ./cmd/ikml
          echo "IK_BIN=$RUNNER_TEMP/ikml$ext" >> "$GITHUB_ENV"
      - name: Good files pass
        id: good
        uses: ./
        with:
          path: testdata/good
          ikml-path: ${{ env.IK_BIN }}
      - name: Bad files are reported with fail off
        id: bad
        uses: ./
        with:
          path: testdata/bad
          fail: "false"
          ikml-path: ${{ env.IK_BIN }}
      - name: Bad files fail the step
        id: badfail
        continue-on-error: true
        uses: ./
        with:
          path: testdata/bad
          ikml-path: ${{ env.IK_BIN }}
      - name: One file
        id: one
        continue-on-error: true
        uses: ./
        with:
          path: testdata/bad/gpx-problems.gpx
          ikml-path: ${{ env.IK_BIN }}
      - name: Warnings fail with strict
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: testdata/good
          strict: "true"
          ikml-path: ${{ env.IK_BIN }}
      - name: A missing path fails the step
        id: missing
        continue-on-error: true
        uses: ./
        with:
          path: no/such/folder
          ikml-path: ${{ env.IK_BIN }}
      - name: A bad switch fails the step
        id: badswitch
        continue-on-error: true
        uses: ./
        with:
          path: testdata/bad
          fail: "flase"
          ikml-path: ${{ env.IK_BIN }}
      - name: Check
        env:
          REPORT: ${{ steps.one.outputs.report }}
        run: |
          set -u
          bad=0
          want() { if [ "$2" != "$3" ]; then echo "::error::$1: got $2, want $3"; bad=1; fi; }
          want "good" "${{ steps.good.outputs.result }} ${{ steps.good.outputs.exit-code }} ${{ steps.good.outputs.errors }} ${{ steps.good.outcome }}" "ok 0 0 success"
          want "bad" "${{ steps.bad.outputs.result }} ${{ steps.bad.outputs.exit-code }} ${{ steps.bad.outcome }}" "issues 1 success"
          [ "${{ steps.bad.outputs.errors }}" -gt 0 ] || { echo "::error::bad files show no errors"; bad=1; }
          want "bad, failing" "${{ steps.badfail.outputs.result }} ${{ steps.badfail.outcome }}" "issues failure"
          want "one file" "${{ steps.one.outputs.result }} ${{ steps.one.outputs.files }} ${{ steps.one.outputs.errors }} ${{ steps.one.outputs.warnings }} ${{ steps.one.outcome }}" "issues 1 1 3 failure"
          want "strict" "${{ steps.strict.outputs.result }} ${{ steps.strict.outcome }}" "issues failure"
          want "missing" "${{ steps.missing.outputs.result }} ${{ steps.missing.outcome }}" "error failure"
          want "bad switch" "${{ steps.badswitch.outputs.result }} ${{ steps.badswitch.outcome }}" "error failure"
          want "version" "${{ steps.good.outputs.version }}" "local"
          grep -q '"code": "gpx-time-backwards"' "$REPORT" || { echo "::error::the report misses gpx-time-backwards"; bad=1; }
          exit $bad

  # The download path from this commit's action.yml, with a published
  # release (0.1.x has no folder check, so the run reports an error; the
  # install, checksum and unpack are what is tested).
  install:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install a published release
        id: run
        continue-on-error: true
        uses: ./
        with:
          path: testdata/good/mymaps-export.kml
          version: v0.1.2
      - name: Check
        run: |
          set -u
          bad=0
          [ "${{ steps.run.outputs.version }}" = v0.1.2 ] || { echo "::error::version ${{ steps.run.outputs.version }}, want v0.1.2"; bad=1; }
          [ "${{ steps.run.outputs.result }}" = ok ] || { echo "::error::result ${{ steps.run.outputs.result }}, want ok for one good file"; bad=1; }
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$RUNNER_TEMP/ikml-bin/ikml$ext" version | tr -d '\r' | grep -Fx "ikml 0.1.2" || { echo "::error::the binary is not 0.1.2"; bad=1; }
          exit $bad

  # The Release workflow runs after every green CI run on main but publishes
  # only when the version is new. Go on only when the newest release was made
  # from the commit that run was for.
  fresh:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.f.outputs.go }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [ "$sha" = "$HEAD_SHA" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; echo "No new release for $HEAD_SHA (newest is $tag)"; fi

  download:
    needs: fresh
    if: needs.fresh.outputs.go == 'yes'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pin: [tag, latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Pick the version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.pin }}" = tag ]; then echo "version=" >> "$GITHUB_OUTPUT"; else echo "version=latest" >> "$GITHUB_OUTPUT"; fi
      # The action as released, so an empty version means the tag's own.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.tag }}
      - name: Good files through the published binary
        id: good
        uses: ./
        with:
          path: testdata/good
          version: ${{ steps.pick.outputs.version }}
      - name: Bad files through the published binary
        id: bad
        uses: ./
        with:
          path: testdata/bad
          fail: "false"
          version: ${{ steps.pick.outputs.version }}
      - name: Check
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -u
          bad=0
          want() { if [ "$2" != "$3" ]; then echo "::error::$1: got $2, want $3"; bad=1; fi; }
          want "good" "${{ steps.good.outputs.result }}" ok
          want "bad" "${{ steps.bad.outputs.result }}" issues
          want "version" "${{ steps.good.outputs.version }}" "$TAG"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$RUNNER_TEMP/ikml-bin/ikml$ext" version | tr -d '\r' | grep -Fx "ikml ${TAG#v}" || { echo "::error::the binary is not $TAG"; bad=1; }
          exit $bad
